{% set name = "juliaup" %}
{% set version = "1.20.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/JuliaLang/{{ name }}/archive/v{{ version }}.zip
  sha256: d2988b888dbb1e3f66b9124241806c176202513a77962aa5298ca57d502e5abb

build:
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    # --no-default-features is explicit here: this build must never pull in the
    # `selfupdate` feature, since juliaup's own self-update mechanism would
    # conflict with updates delivered through conda.
    - cargo install --locked --no-default-features --root "$PREFIX" --path .  # [unix]
    - cargo install --locked --no-default-features --root "%LIBRARY_PREFIX%" --path . || goto :error  # [win]
    - rm -f "${PREFIX}/.crates.toml"  # [unix]
    - del /F /Q "%LIBRARY_PREFIX%\.crates.toml"  # [win]
    # A standard juliaup install wires up shell completions; do the same for
    # the shells conda environments commonly activate into.
    - mkdir -p "${PREFIX}/share/bash-completion/completions" "${PREFIX}/share/zsh/site-functions" "${PREFIX}/share/fish/vendor_completions.d"  # [unix]
    - "${PREFIX}/bin/juliaup" completions bash > "${PREFIX}/share/bash-completion/completions/juliaup"  # [unix]
    - "${PREFIX}/bin/juliaup" completions zsh > "${PREFIX}/share/zsh/site-functions/_juliaup"  # [unix]
    - "${PREFIX}/bin/juliaup" completions fish > "${PREFIX}/share/fish/vendor_completions.d/juliaup.fish"  # [unix]
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  run:

test:
  commands:
    - juliaup status
    - test -f "${PREFIX}/share/bash-completion/completions/juliaup"  # [unix]
    - test -f "${PREFIX}/share/zsh/site-functions/_juliaup"  # [unix]
    - test -f "${PREFIX}/share/fish/vendor_completions.d/juliaup.fish"  # [unix]

about:
  home: https://github.com/JuliaLang/juliaup
  summary: Julia installer and version multiplexer
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - mkitti
    - ngam
